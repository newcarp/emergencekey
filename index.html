<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b0d10">
  <title>EmergenceKey</title>
  <style>
    :root {
      --bg: #0b0d10;
      --panel: #151a22;
      --panel-2: #1c232e;
      --border: #2c3544;
      --text: #e8edf5;
      --muted: #8b95a8;
      --accent: #3dffa8;
      --accent-dim: #1a4d38;
      --warn: #ffcc66;
      --danger: #ff5c7a;
      --blue: #6cb6ff;
      --radius: 10px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      overscroll-behavior: none;
      touch-action: manipulation;
    }
    body {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
      gap: 6px;
    }
    button, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; -webkit-tap-highlight-color: transparent; }

    .bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 6px 8px;
      flex-shrink: 0;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }
    .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #6b7380;
      flex-shrink: 0;
    }
    .dot.connecting { background: var(--warn); animation: pulse 1s ease-in-out infinite; }
    .dot.connected { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .dot.error { background: var(--danger); }
    @keyframes pulse { 50% { opacity: .35; } }
    #statusText {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #devName { color: var(--muted); font-weight: 500; font-size: 12px; }
    .bar-btns { display: flex; gap: 6px; flex-shrink: 0; }
    .btn {
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel-2);
      font-weight: 700;
      font-size: 14px;
    }
    .btn.primary { background: var(--accent); color: #04140c; border-color: var(--accent); }
    .btn.danger { background: #3a1520; color: var(--danger); border-color: #5a2233; }
    .btn.on { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }

    @media (max-width: 560px) {
      .bar {
        flex-wrap: wrap;
        gap: 6px;
        align-items: stretch;
      }
      .status {
        flex: 1 1 100%;
        min-height: 28px;
      }
      .bar-btns {
        flex: 1 1 100%;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .bar-btns .btn {
        flex: 1 1 calc(50% - 3px);
        min-width: 0;
        padding: 0 8px;
        font-size: 13px;
        order: 3;
      }
      #btnConn {
        order: 1;
        flex: 1 1 100%;
      }
      #btnRe {
        order: 2;
        flex: 1 1 100%;
      }
      .modgrid {
        flex: 3.4;
        min-width: 116px;
      }
      .modgrid .key {
        font-size: 13px;
        min-height: 42px;
      }
      .key.space { flex: 4.5; }
      .arrows {
        flex: 0 0 104px;
        width: 104px;
      }
      textarea {
        min-height: 120px;
        height: auto;
      }
    }

    .warn {
      display: none;
      font-size: 10px;
      line-height: 1.3;
      color: var(--warn);
      background: #2a2210;
      border: 1px solid #5a4a20;
      border-radius: 8px;
      padding: 4px 8px;
      flex-shrink: 0;
    }
    .warn.show { display: block; }

    .kb {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
      touch-action: manipulation;
    }
    .qwerty-wrap {
      display: grid;
      grid-template-rows: 1fr;
      transition: grid-template-rows .38s cubic-bezier(.4, 0, .2, 1);
    }
    .kb.keys-hidden .qwerty-wrap {
      grid-template-rows: 0fr;
    }
    .qwerty-wrap > .qwerty {
      min-height: 0;
      overflow: hidden;
    }
    .row { display: flex; gap: 3px; align-items: stretch; }
    .qwerty {
      display: flex;
      flex-direction: column;
      gap: 3px;
      transform: translateY(0);
      opacity: 1;
      transition:
        transform .38s cubic-bezier(.4, 0, .2, 1),
        opacity .28s ease;
    }
    .kb.keys-hidden .qwerty {
      transform: translateY(18px);
      opacity: 0;
      pointer-events: none;
    }
    .key {
      flex: 1;
      min-width: 0;
      min-height: 32px;
      border: 1.5px solid #5a6a82;
      border-radius: 6px;
      background: var(--panel-2);
      font-weight: 700;
      font-size: 12px;
      padding: 0 2px;
      -webkit-appearance: none;
      appearance: none;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      transition:
        background .18s ease,
        color .18s ease,
        border-color .18s ease,
        box-shadow .18s ease;
    }
    .key.on { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }
    .key:active,
    .key.pressed {
      transition-duration: 0s;
      background: var(--accent);
      color: #04140c;
      border-color: var(--accent);
      box-shadow: 0 0 14px 2px rgba(61, 255, 168, .65);
    }
    .key.wide { flex: 1.7; }
    .key.wide2 { flex: 2.3; }
    .key.space { flex: 8; }
    .key.del { flex: 1.4; }
    .toprow .key { flex: 1; font-size: 10px; min-height: 28px; }
    .bottomrow { align-items: stretch; }
    .modgrid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: 1fr 1fr;
      gap: 3px;
      flex: 2.2;
    }
    .modgrid .key {
      font-size: 11px;
      letter-spacing: -0.02em;
    }
    .arrows {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: 1fr 1fr;
      gap: 3px;
      flex: 0 0 118px;
      width: 118px;
    }
    .arrows .key { min-height: 0; font-size: 16px; line-height: 1; }
    .arrows .key.fn-label { font-size: 10px; font-weight: 800; }
    .arrows .up { grid-column: 2; grid-row: 1; }
    .arrows .left { grid-column: 1; grid-row: 2; }
    .arrows .down { grid-column: 2; grid-row: 2; }
    .arrows .right { grid-column: 3; grid-row: 2; }
    textarea {
      width: 100%;
      min-height: 38px;
      height: 38px;
      max-height: 40vh;
      resize: none;
      overflow-y: auto;
      background: #0e1218;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 16px;
      line-height: 1.35;
      field-sizing: content;
    }
    .send-row { display: flex; gap: 6px; }
    .send-row .btn { flex: 1; }

    #pad {
      flex: 1 1 auto;
      min-height: 64px;
      position: relative;
      border-radius: 16px;
      border: 1px solid var(--border);
      background:
        radial-gradient(ellipse at 50% 30%, #1a2433 0%, #0d1117 70%);
      touch-action: none;
      user-select: none;
      overflow: hidden;
    }
    #pad.down { border-color: var(--blue); }
    #pad.dragging { border-color: var(--accent); }
    .btn.capture { background: var(--panel-2); border-color: var(--blue); color: var(--blue); }
    .btn.capture.on {
      background: var(--panel-2);
      color: var(--blue);
      border-color: var(--blue);
      animation: captureGlow 2.4s ease-in-out infinite;
    }
    @keyframes captureGlow {
      0%, 100% {
        box-shadow: 0 0 0 0 transparent;
        filter: brightness(1);
      }
      50% {
        box-shadow: 0 0 14px 2px rgba(108, 182, 255, .55);
        filter: brightness(1.25);
      }
    }
    .pad-hint {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      pointer-events: none;
      color: var(--muted);
      text-align: center;
      padding: 16px;
      font-size: 13px;
      line-height: 1.4;
    }
    .pad-hint b { color: var(--text); font-size: 12px; letter-spacing: .12em; }
    .finger {
      position: absolute;
      width: 44px; height: 44px;
      margin: -22px 0 0 -22px;
      border-radius: 50%;
      background: rgba(108, 182, 255, .28);
      border: 2px solid var(--blue);
      pointer-events: none;
    }
    .sens-wrap {
      display: grid;
      grid-template-rows: 1fr;
      transition:
        grid-template-rows .38s cubic-bezier(.4, 0, .2, 1),
        margin-bottom .38s cubic-bezier(.4, 0, .2, 1);
      flex-shrink: 0;
      margin-bottom: 0;
    }
    .sens-wrap.hidden {
      grid-template-rows: 0fr;
      margin-bottom: -6px;
    }
    .sens-wrap > .sens {
      min-height: 0;
      overflow: hidden;
    }
    .sens {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 4px 10px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
      opacity: 1;
      transform: translateY(0);
      transition:
        transform .38s cubic-bezier(.4, 0, .2, 1),
        opacity .28s ease,
        border-color .28s ease,
        background-color .28s ease;
    }
    .sens-wrap.hidden > .sens {
      opacity: 0;
      transform: translateY(-10px);
      pointer-events: none;
      border-color: transparent;
      background: transparent;
    }
    .sens label { flex-shrink: 0; letter-spacing: .04em; }
    .sens input[type="range"] {
      flex: 1;
      min-width: 0;
      accent-color: var(--accent);
      height: 28px;
    }
    #sensVal {
      flex-shrink: 0;
      min-width: 2.6em;
      text-align: right;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    #unsupported {
      display: none;
      flex-shrink: 0;
      background: #3a1520;
      color: #ffd0d8;
      border: 1px solid #5a2233;
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
    }
    #unsupported.show { display: block; }
    @media (min-height: 820px) {
      .key { min-height: 40px; font-size: 14px; }
      .toprow .key { min-height: 32px; font-size: 12px; }
      .arrows .key { font-size: 20px; }
      textarea { min-height: 56px; height: auto; }
      .btn { min-height: 44px; }
    }
  </style>
</head>
<body>
  <div id="unsupported"></div>

  <div class="bar">
    <div class="status">

      <div style="min-width:0">
        <div id="statusText">disconnected</div>

        <button class="key ck" data-key="0x1F">2</button>

<script src="https://beacio.com/beacio.js"></script>
<script>
(() => {
  const SERVICE = '2d2a0001-8a5a-4e76-a2e3-1e57d9a1b001';
  const WRITE   = '2d2a0002-8a5a-4e76-a2e3-1e57d9a1b001';
  const GAP_MS  = 12;
  // Default ATT MTU is 23 → 20-byte payload. Firmware accepts batched 3-byte v1 frames.
  const MAX_PACKET = 18;
  const WRITE_RETRIES = 3;
  const STORE   = 'emergencekey-device-id';
  const STORE_SENS = 'emergencekey-mouse-sens';

  const $ = (id) => document.getElementById(id);
  const dot = $('dot'), statusText = $('statusText'), devName = $('devName');
  const btnConn = $('btnConn'), btnRe = $('btnRe'), btnSend = $('btnSend');
  const btnCapture = $('btnCapture'), btnKb = $('btnKb'), btnSens = $('btnSens'), warnText = $('warnText');
  const textEl = $('text'), pad = $('pad'), unsupported = $('unsupported'), kb = $('kb');
  const sensEl = $('sens'), sensVal = $('sensVal'), sensRow = $('sensRow');
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  const ble = () => navigator.bluetooth || navigator.beacio || null;
  const realBle = () => {
    const b = ble();
    return !!(b && typeof b.requestDevice === 'function' && !b.__beacioCDNStub);
  };

  let device = null, characteristic = null, connected = false;
  let stickyMod = 0;
  const queue = [];
  let pumping = false;

  const KEY = Object.create(null);
  'abcdefghijklmnopqrstuvwxyz'.split('').forEach((c, i) => {
    KEY[c] = [0x00, 0x04 + i];
    KEY[c.toUpperCase()] = [0x02, 0x04 + i];
  });
  '123456789'.split('').forEach((c, i) => { KEY[c] = [0x00, 0x1E + i]; });
  KEY['0'] = [0x00, 0x27];
  '!@#$%^&*()'.split('').forEach((c, i) => {
    KEY[c] = [0x02, i === 9 ? 0x27 : 0x1E + i];
  });
  Object.assign(KEY, {
    ' ': [0x00, 0x2C], '\n': [0x00, 0x28], '\r': [0x00, 0x28], '\t': [0x00, 0x2B],
    '-': [0x00, 0x2D], '_': [0x02, 0x2D], '=': [0x00, 0x2E], '+': [0x02, 0x2E],
    '[': [0x00, 0x2F], '{': [0x02, 0x2F], ']': [0x00, 0x30], '}': [0x02, 0x30],
    '\\': [0x00, 0x31], '|': [0x02, 0x31],
    ';': [0x00, 0x33], ':': [0x02, 0x33], "'": [0x00, 0x34], '"': [0x02, 0x34],
    '`': [0x00, 0x35], '~': [0x02, 0x35], ',': [0x00, 0x36], '<': [0x02, 0x36],
    '.': [0x00, 0x37], '>': [0x02, 0x37], '/': [0x00, 0x38], '?': [0x02, 0x38],
  });

  function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }
  function sbyte(n) {
    n = Math.max(-127, Math.min(127, Math.round(n)));
    return n & 0xff;
  }

  function setStatus(state, detail) {
    dot.className = 'dot' + (state === 'disconnected' ? '' : ' ' + state);
    const labels = {
      disconnected: 'disconnected',
      connecting: 'connecting…',
      connected: 'connected',
      error: 'error',
    };
    statusText.textContent = detail || labels[state] || state;
    btnConn.textContent = connected ? 'Disconnect' : 'Connect';
    btnConn.className = 'btn ' + (connected ? 'danger' : 'primary');
    btnConn.disabled = state === 'connecting';
  }

  function enqueue(bytes, coalesceType) {
    if (coalesceType != null) {
      const i = queue.findIndex((m) => m[0] === coalesceType);
      if (i >= 0) queue[i] = bytes;
      else queue.push(bytes);
    } else {
      queue.push(bytes);
    }
    pump();
  }

    return !!(connected && characteristic && device && device.gatt && device.gatt.connected);

  async function writePacket(bytes) {
    const c = characteristic;
    if (!c) throw new Error('not connected');
    // Prefer write-with-response: WRITE_NR floods iOS/NimBLE (~20–25 packets) and drops the link.
    if (typeof c.writeValueWithResponse === 'function' && c.properties.write) {
      await c.writeValueWithResponse(bytes);
      return GAP_MS;
    }
    if (c.properties.write && typeof c.writeValue === 'function') {
      await c.writeValue(bytes);
      return GAP_MS;
    }
    await c.writeValueWithoutResponse(bytes);
    return 40;
  }

  function takeChunk() {
    const first = queue.shift();
    if (!first) return null;
    if (first.length !== 3) return first;
    const parts = [first];
    let size = first.length;
    while (queue.length && queue[0].length === 3 && size + queue[0].length <= MAX_PACKET) {
      parts.push(queue.shift());
      size += 3;
    }
    if (parts.length === 1) return first;
    const out = new Uint8Array(size);
    let o = 0;
    for (const p of parts) { out.set(p, o); o += p.length; }
    return out;
  }

  async function pump() {
    if (pumping) return;
    pumping = true;
    while (queue.length) {
      if (!gattUp()) { queue.length = 0; break; }
      const msg = takeChunk();
      let retries = WRITE_RETRIES;
      while (true) {
        try {
          const gap = await writePacket(msg);
          await sleep(gap);
          break;
        } catch (err) {
          console.warn('write failed', err);
          if (!gattUp()) {
            queue.length = 0;
            if (connected) onDisconnected();
            pumping = false;
            return;
          }
          retries -= 1;
          if (retries < 0) break;
          await sleep(50);

        const x = (p[1] << 24 >> 24) + (b1 << 24 >> 24);
        const y = (p[2] << 24 >> 24) + (b2 << 24 >> 24);
        queue[i] = new Uint8Array([type, sbyte(x), sbyte(y)]);
        pump();

      characteristic = null;

      const list = await api.getDevices();
      const dev = list.find((d) => d.id === id) || list[0];
      if (!dev) throw new Error('no saved device');
      await gattConnect(dev);
    } catch (err) {

  /* ---- trackpad ---- */
  const TAP_PX = 14, TAP_MS = 300, DBL_MS = 340, SCROLL_DIV = 6;

    } else if (ios) {
      unsupported.innerHTML =
        'Safari has no native Web Bluetooth. Tap <b>aA</b> (left of the URL) → Manage Extensions → enable <b>beacio</b> → Allow, then tap Connect.';
    } else {
      unsupported.textContent = 'This browser has no Web Bluetooth. Use Chrome/Edge (desktop or Android).';
    }
  }
  function refreshBleBanner() {
    if (realBle()) {
      unsupported.classList.remove('show');
      unsupported.textContent = '';
      refreshReconnect();
      return;
    }
    showBleHelp();
    if (!connected) btnRe.hidden = true;
  }
  if (!ios) refreshBleBanner();
  window.addEventListener('beacio:statechange', refreshBleBanner);
  setTimeout(refreshBleBanner, 300);
  setTimeout(refreshBleBanner, 1400);
  btnConn.title = 'Click to connect. Right-click to scan all BLE devices.';
  // iOS: banner skipped above; still probe reconnect once BLE polyfill may be ready.
  if (ios) refreshReconnect();
})();
</script>
</body>
</html>
